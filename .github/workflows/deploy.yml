name: Deploy

# Deploys production once CI passes on master: Convex first, so the schema and functions
# are live before the Workers that call them, then the edge, then the Loft.
# One-time setup (secrets, variables, DNS) is in docs/deploy.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Deploys queue up one after another; never cancel one halfway through
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: production
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # Inlined into the Loft's browser bundle at build time; its server reads its own
      # copy from the Worker's secrets
      VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
    # Each step skips with a notice until its secrets are set (a job-level `if` can't
    # read secrets), and a failed step stops the ones after it
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
      - name: Deploy Convex
        working-directory: packages/backend
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "::notice::CONVEX_DEPLOY_KEY isn't set, so Convex wasn't deployed. See docs/deploy.md."
            exit 0
          fi
          vp exec convex deploy
      - name: Deploy the edge
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID isn't set, so the edge wasn't deployed. See docs/deploy.md."
            exit 0
          fi
          vp run --filter edge deploy
      - name: Deploy the Loft
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$VITE_CONVEX_URL" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID or VITE_CONVEX_URL isn't set, so the Loft wasn't deployed. See docs/deploy.md."
            exit 0
          fi
          vp run --filter loft deploy
