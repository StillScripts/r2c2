<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Productivity</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='2' width='24' height='28' rx='4' fill='%23faf9f5' stroke='%23D97757' stroke-width='2'/%3E%3Crect x='8' y='0' width='16' height='5' rx='2.5' fill='%23D97757'/%3E%3Cpath d='M9 13l3 3 5-5' fill='none' stroke='%23D97757' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='20' y='12' width='5' height='2' rx='1' fill='%23c4c4c2'/%3E%3Crect x='9' y='20' width='10' height='2' rx='1' fill='%23c4c4c2'/%3E%3Crect x='9' y='25' width='7' height='2' rx='1' fill='%23c4c4c2'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg-primary: #faf9f5;
        --bg-secondary: #f5f4ef;
        --bg-card: #ffffff;
        --text-primary: #141413;
        --text-secondary: #5c5c5a;
        --text-muted: #8c8c8a;
        --accent: #d97757;
        --accent-hover: #c4684a;
        --border: #e5e4df;
        --border-light: #eeeee9;
        --shadow: rgba(20, 20, 19, 0.04);
        --shadow-hover: rgba(20, 20, 19, 0.08);
      }

      body {
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background: var(--bg-primary);
        color: var(--text-primary);
        height: 100vh;
        padding: 20px 24px;
        line-height: 1.5;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }

      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      h2 {
        font-size: 1.1rem;
        font-weight: 600;
        margin-bottom: 12px;
        color: var(--text-secondary);
      }

      .header-left {
        display: flex;
        align-items: flex-start;
        gap: 0;
      }

      .view-toggle {
        display: flex;
        gap: 4px;
        background: var(--bg-secondary);
        padding: 4px;
        border-radius: 8px;
        margin-left: 16px;
      }

      .view-toggle button {
        background: transparent;
        border: none;
        padding: 6px 14px;
        font-size: 13px;
        color: var(--text-muted);
        border-radius: 6px;
      }

      .view-toggle button:hover {
        color: var(--text-primary);
        background: transparent;
      }

      .view-toggle button.active {
        background: var(--bg-card);
        color: var(--text-primary);
        box-shadow: 0 1px 3px var(--shadow);
      }

      .buttons {
        display: flex;
        gap: 12px;
      }

      button {
        background: var(--bg-card);
        color: var(--text-primary);
        border: 1px solid var(--border);
        padding: 10px 18px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
        font-family: inherit;
        transition: all 0.15s ease;
      }

      button:hover {
        background: var(--bg-secondary);
        border-color: var(--text-muted);
      }

      button.primary {
        background: var(--accent);
        color: white;
        border-color: var(--accent);
      }

      button.primary:hover {
        background: var(--accent-hover);
        border-color: var(--accent-hover);
      }

      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      /* ===== TASKS STYLES ===== */

      .board {
        display: flex;
        gap: 24px;
        overflow-x: auto;
        overflow-y: hidden;
        padding-bottom: 24px;
        flex: 1;
        min-height: 0;
      }

      .column {
        background: var(--bg-secondary);
        border-radius: 12px;
        min-width: 340px;
        max-width: 340px;
        display: flex;
        flex-direction: column;
        height: 100%;
        max-height: 100%;
      }

      .column-header {
        padding: 16px 18px;
        font-weight: 600;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-secondary);
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: grab;
      }

      .column-header:active {
        cursor: grabbing;
      }

      .column.dragging-column {
        opacity: 0.5;
      }

      .column-drop-indicator {
        width: 3px;
        background: var(--accent);
        border-radius: 2px;
        margin: 0 -2px;
        min-height: 100px;
      }

      .column-header .count {
        background: var(--bg-card);
        padding: 3px 10px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: 500;
        color: var(--text-muted);
      }

      .cards {
        flex: 1;
        overflow-y: auto;
        padding: 0 12px 12px;
        min-height: 100px;
      }

      .cards.drag-over {
        background: rgba(217, 119, 87, 0.05);
        border-radius: 8px;
      }

      .task-card {
        background: var(--bg-card);
        border: 1px solid var(--border-light);
        border-radius: 10px;
        padding: 14px 16px;
        margin-bottom: 10px;
        cursor: grab;
        transition: all 0.15s ease;
        box-shadow: 0 1px 3px var(--shadow);
        position: relative;
      }

      .task-card:hover {
        box-shadow: 0 4px 12px var(--shadow-hover);
        border-color: var(--border);
      }

      .task-card .add-on-hover {
        display: none;
      }

      .task-card:hover .add-on-hover {
        display: block;
      }

      .task-card .delete-btn {
        display: none;
        position: absolute;
        top: 8px;
        right: 8px;
        background: transparent;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        padding: 4px 6px;
        font-size: 14px;
        line-height: 1;
        border-radius: 4px;
      }

      .task-card:hover .delete-btn {
        display: block;
      }

      .task-card .delete-btn:hover {
        background: var(--bg-secondary);
        color: var(--accent);
      }

      .task-card.dragging {
        opacity: 0.5;
        transform: rotate(2deg);
      }

      .card-title {
        font-size: 14px;
        font-weight: 500;
        line-height: 1.5;
        color: var(--text-primary);
      }

      .card-note {
        font-size: 13px;
        color: var(--text-muted);
        margin-top: 6px;
        line-height: 1.4;
        overflow-wrap: break-word;
        word-break: break-word;
      }

      .card-subtasks {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid var(--border-light);
        font-size: 13px;
        color: var(--text-secondary);
      }

      .subtask {
        padding: 3px 0;
        display: flex;
        align-items: flex-start;
        gap: 8px;
      }

      .checkbox {
        width: 18px;
        height: 18px;
        min-width: 18px;
        min-height: 18px;
        flex-shrink: 0;
        border: 2px solid var(--border);
        border-radius: 5px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        vertical-align: middle;
        cursor: pointer;
        transition: all 0.15s ease;
        background: var(--bg-card);
      }

      .checkbox:hover {
        border-color: var(--accent);
      }

      .checkbox.checked {
        background: var(--accent);
        border-color: var(--accent);
      }

      .checkbox.checked::after {
        content: "";
        width: 5px;
        height: 9px;
        border: solid white;
        border-width: 0 2px 2px 0;
        transform: rotate(45deg);
        margin-bottom: 2px;
      }

      .empty-state {
        text-align: center;
        padding: 80px 40px;
        color: var(--text-muted);
      }

      .empty-state button {
        font-size: 16px;
        padding: 14px 28px;
        background: var(--accent);
        border: none;
        color: white;
      }

      .empty-state button:hover {
        background: var(--accent-hover);
      }

      .status-bar {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--text-primary);
        color: var(--bg-primary);
        padding: 12px 24px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 500;
        opacity: 0;
        transition: opacity 0.2s ease;
        box-shadow: 0 4px 20px rgba(20, 20, 19, 0.15);
        z-index: 200;
      }

      .status-bar.visible {
        opacity: 1;
      }

      .add-card {
        padding: 12px;
      }

      .add-card button {
        width: 100%;
        background: transparent;
        border: 2px dashed var(--border);
        color: var(--text-muted);
        font-weight: 500;
      }

      .add-card button:hover {
        border-color: var(--accent);
        color: var(--accent);
        background: transparent;
      }

      .new-task-input {
        width: 100%;
        background: var(--bg-card);
        border: 2px solid var(--accent);
        border-radius: 8px;
        padding: 12px;
        color: var(--text-primary);
        font-size: 14px;
        font-family: inherit;
        resize: none;
      }

      .new-task-input:focus {
        outline: none;
      }

      .new-task-input::placeholder {
        color: var(--text-muted);
      }

      /* Scrollbar styling */
      .cards::-webkit-scrollbar,
      .list-view::-webkit-scrollbar {
        width: 6px;
      }

      .cards::-webkit-scrollbar-track,
      .list-view::-webkit-scrollbar-track {
        background: transparent;
      }

      .cards::-webkit-scrollbar-thumb,
      .list-view::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 3px;
      }

      .cards::-webkit-scrollbar-thumb:hover,
      .list-view::-webkit-scrollbar-thumb:hover {
        background: var(--text-muted);
      }

      /* List View Styles */
      .list-view {
        max-width: 800px;
        margin: 0 auto;
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        min-height: 0;
      }

      .list-section {
        margin-bottom: 28px;
      }

      .list-section.drag-over {
        background: rgba(217, 119, 87, 0.05);
        border-radius: 8px;
        margin: 0 -12px 32px;
        padding: 0 12px;
      }

      .list-section-header {
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-secondary);
        padding: 4px 0;
        margin-bottom: 6px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .list-section-header .section-title {
        cursor: pointer;
      }

      .list-section-header .section-title:hover {
        color: var(--text-primary);
      }

      .list-section-header .count {
        font-size: 12px;
        color: var(--text-muted);
        font-weight: 500;
      }

      .list-item {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 12px 14px;
        margin-bottom: 6px;
        background: var(--bg-card);
        border: 1px solid var(--border-light);
        cursor: grab;
        position: relative;
        border-radius: 10px;
        transition: all 0.15s ease;
        box-shadow: 0 1px 3px var(--shadow);
      }

      .list-item:active {
        cursor: grabbing;
      }

      .list-item:hover {
        box-shadow: 0 4px 12px var(--shadow-hover);
        border-color: var(--border);
      }

      .list-item.dragging {
        opacity: 0.5;
        background: var(--bg-secondary);
      }

      .list-item .checkbox {
        margin-top: 2px;
        flex-shrink: 0;
      }

      .list-item-content {
        flex: 1;
        min-width: 0;
      }

      .list-item-title {
        font-size: 15px;
        color: var(--text-primary);
        line-height: 1.4;
      }

      .list-item-title.checked {
        color: var(--text-muted);
        text-decoration: line-through;
      }

      .list-item-note {
        font-size: 13px;
        color: var(--text-muted);
        margin-top: 4px;
        cursor: pointer;
      }

      .list-item-note:hover {
        color: var(--text-secondary);
      }

      .list-item-note.add-note {
        font-style: italic;
        display: none;
      }

      .list-item:hover .list-item-note.add-note {
        display: block;
      }

      .list-item-subtasks {
        margin-top: 8px;
        padding-left: 2px;
      }

      .list-item-subtask {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        padding: 3px 0;
        font-size: 13px;
        color: var(--text-secondary);
      }

      .list-item-subtask .checkbox {
        width: 16px;
        height: 16px;
        min-width: 16px;
        min-height: 16px;
        margin-top: 1px;
      }

      .list-item-subtask span {
        cursor: pointer;
      }

      .list-item-subtask span:hover {
        color: var(--text-primary);
      }

      .list-item-add-subtask {
        font-size: 13px;
        color: var(--text-muted);
        font-style: italic;
        cursor: pointer;
        padding: 3px 0;
        padding-left: 24px;
        display: none;
      }

      .list-item:hover .list-item-add-subtask {
        display: block;
      }

      .list-item-add-subtask:hover {
        color: var(--accent);
      }

      .list-item-section {
        font-size: 11px;
        color: var(--text-muted);
        background: var(--bg-secondary);
        padding: 2px 8px;
        border-radius: 4px;
        white-space: nowrap;
      }

      .list-item-actions {
        display: none;
        position: absolute;
        top: 8px;
        right: 8px;
      }

      .list-item:hover .list-item-actions {
        display: flex;
        gap: 4px;
      }

      .list-item-actions button {
        background: transparent;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        padding: 4px 6px;
        font-size: 14px;
        line-height: 1;
        border-radius: 4px;
      }

      .list-item-actions button:hover {
        background: var(--bg-card);
        color: var(--accent);
      }

      .list-drop-indicator {
        height: 3px;
        background: var(--accent);
        border-radius: 2px;
        margin: 2px -12px;
      }

      .list-add-section {
        margin-top: 16px;
        padding: 16px;
        border: 2px dashed var(--border);
        border-radius: 8px;
        text-align: center;
        cursor: pointer;
        color: var(--text-muted);
        font-size: 14px;
        font-weight: 500;
        transition: all 0.15s ease;
      }

      .list-add-section:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      .quick-add {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 0;
      }

      .quick-add-input {
        flex: 1;
        background: transparent;
        border: none;
        font-size: 15px;
        color: var(--text-primary);
        font-family: inherit;
        outline: none;
      }

      .quick-add-input::placeholder {
        color: var(--text-muted);
      }

      .quick-add-section {
        font-size: 12px;
        color: var(--text-muted);
        background: var(--bg-secondary);
        padding: 4px 10px;
        border-radius: 6px;
        cursor: pointer;
        border: 1px solid var(--border);
      }

      .quick-add-section:hover {
        border-color: var(--accent);
      }

      .section-picker {
        position: absolute;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: 0 4px 20px var(--shadow-hover);
        padding: 4px;
        z-index: 100;
      }

      .section-picker button {
        display: block;
        width: 100%;
        text-align: left;
        padding: 8px 12px;
        font-size: 13px;
        background: transparent;
        border: none;
        border-radius: 6px;
      }

      .section-picker button:hover {
        background: var(--bg-secondary);
      }

      /* ===== MEMORY STYLES ===== */

      .memory-tabs {
        display: flex;
        gap: 4px;
        margin-bottom: 12px;
        flex-wrap: wrap;
        background: var(--bg-secondary);
        padding: 4px;
        border-radius: 8px;
        flex-shrink: 0;
      }

      .memory-tab {
        background: transparent;
        color: var(--text-muted);
        padding: 8px 16px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
        transition: all 0.15s ease;
        text-transform: capitalize;
      }

      .memory-tab:hover {
        color: var(--text-primary);
      }

      .memory-tab.active {
        color: var(--text-primary);
        background: var(--bg-card);
        box-shadow: 0 1px 3px var(--shadow);
      }

      .memory-tab .count {
        background: var(--bg-secondary);
        padding: 2px 8px;
        border-radius: 10px;
        font-size: 11px;
        margin-left: 6px;
        color: var(--text-muted);
      }

      .memory-tab.active .count {
        background: var(--border-light);
      }

      .memory-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 16px;
      }

      .memory-flat-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }

      .memory-flat-table th {
        text-align: left;
        padding: 10px 16px;
        font-weight: 500;
        color: var(--text-muted);
        border-bottom: 1px solid var(--border);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }

      .memory-flat-table td {
        padding: 9px 16px;
        border-bottom: 1px solid var(--border-light);
        color: var(--text-primary);
        line-height: 1.4;
      }

      .memory-flat-table td:first-child {
        color: var(--text-muted);
        font-weight: 500;
        white-space: nowrap;
        width: 120px;
      }

      .memory-flat-table tr:last-child td {
        border-bottom: none;
      }

      .memory-flat-table tr:hover td {
        background: var(--bg-secondary);
      }

      .memory-card {
        background: var(--bg-card);
        border: 1px solid var(--border-light);
        border-radius: 10px;
        padding: 16px;
        cursor: pointer;
        transition: all 0.15s ease;
        box-shadow: 0 1px 3px var(--shadow);
      }

      .memory-card:hover {
        border-color: var(--accent);
        box-shadow: 0 4px 12px var(--shadow-hover);
      }

      .memory-card-title {
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--text-primary);
      }

      .memory-card-meta {
        font-size: 13px;
        color: var(--text-muted);
        margin-bottom: 8px;
      }

      .memory-card-preview {
        font-size: 13px;
        color: var(--text-secondary);
        line-height: 1.5;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 4;
        -webkit-box-orient: vertical;
      }

      .memory-card-fields {
        margin-top: 10px;
        font-size: 12px;
      }

      .memory-card-field {
        display: flex;
        gap: 8px;
        margin-bottom: 4px;
      }

      .memory-card-field-label {
        color: var(--text-muted);
        min-width: 80px;
      }

      .memory-card-field-value {
        color: var(--text-secondary);
      }

      .file-card {
        background: var(--bg-card);
        border: 1px solid var(--border-light);
        border-radius: 10px;
        margin-bottom: 16px;
        box-shadow: 0 1px 3px var(--shadow);
      }

      .file-card-header {
        padding: 16px;
        border-bottom: 1px solid var(--border-light);
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
      }

      .file-card-header:hover {
        background: var(--bg-secondary);
      }

      .file-card-title {
        font-size: 14px;
        font-weight: 600;
        color: var(--text-primary);
      }

      .file-card-content {
        padding: 16px;
        font-size: 13px;
        line-height: 1.6;
        white-space: pre-wrap;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        overflow-y: auto;
        display: none;
        color: var(--text-secondary);
      }

      .file-card-content.expanded {
        display: block;
      }

      .stats {
        display: flex;
        gap: 16px;
        margin-bottom: 24px;
        flex-wrap: wrap;
      }

      .stat {
        background: var(--bg-card);
        border: 1px solid var(--border-light);
        border-radius: 10px;
        padding: 16px 24px;
        min-width: 100px;
        box-shadow: 0 1px 3px var(--shadow);
      }

      .stat-value {
        font-size: 28px;
        font-weight: 600;
        color: var(--accent);
      }

      .stat-label {
        font-size: 12px;
        color: var(--text-muted);
        text-transform: capitalize;
        margin-top: 4px;
      }

      .search-box {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 16px;
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 20px;
      }

      .search-box input {
        flex: 1;
        background: transparent;
        border: none;
        color: var(--text-primary);
        font-size: 14px;
        font-family: inherit;
        outline: none;
      }

      .search-box input::placeholder {
        color: var(--text-muted);
      }

      .add-btn {
        background: transparent;
        border: 2px dashed var(--border);
        color: var(--text-muted);
        padding: 40px;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.15s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-weight: 500;
      }

      .add-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      .markdown-content {
        line-height: 1.6;
        color: var(--text-secondary);
      }

      .markdown-content h1 {
        font-size: 1.4em;
        margin: 16px 0 8px;
        color: var(--text-primary);
      }
      .markdown-content h2 {
        font-size: 1.2em;
        margin: 14px 0 6px;
        color: var(--text-primary);
      }
      .markdown-content h3 {
        font-size: 1.1em;
        margin: 12px 0 4px;
        color: var(--text-secondary);
      }
      .markdown-content p {
        margin: 8px 0;
      }
      .markdown-content ul,
      .markdown-content ol {
        margin: 8px 0 8px 20px;
      }
      .markdown-content li {
        margin: 4px 0;
      }
      .markdown-content code {
        background: var(--bg-secondary);
        padding: 2px 6px;
        border-radius: 4px;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        color: var(--text-primary);
      }
      .markdown-content pre {
        background: var(--bg-secondary);
        padding: 12px;
        border-radius: 8px;
        overflow-x: auto;
        margin: 8px 0;
        border: 1px solid var(--border-light);
      }
      .markdown-content table {
        width: 100%;
        border-collapse: collapse;
        margin: 8px 0;
        font-size: 13px;
      }
      .markdown-content th,
      .markdown-content td {
        padding: 12px 16px;
        text-align: left;
        border-bottom: 1px solid var(--border-light);
      }
      .markdown-content th {
        background: var(--bg-secondary);
        font-weight: 600;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-secondary);
      }

      /* Modal */
      .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(20, 20, 19, 0.5);
        z-index: 100;
        align-items: center;
        justify-content: center;
      }

      .modal-overlay.visible {
        display: flex;
      }

      .modal {
        background: var(--bg-card);
        border-radius: 12px;
        width: 90%;
        max-width: 800px;
        max-height: 85vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        box-shadow: 0 20px 60px rgba(20, 20, 19, 0.2);

      .modal-header {
        padding: 20px;

        display: flex;
        justify-content: space-between;
        align-items: center;

      .modal-header h3 {
        font-size: 18px;
        font-weight: 600;
        color: var(--text-primary);
      }

      .modal-close {
        background: transparent;
        border: none;
        color: var(--text-muted);
        font-size: 24px;
        cursor: pointer;
        padding: 0;
        line-height: 1;
      }

      .modal-close:hover {
        color: var(--text-primary);

      .modal-body {
        padding: 20px;
        overflow-y: auto;
        flex: 1;
      }

      .modal-footer {
        padding: 16px 20px;
        border-top: 1px solid var(--border);
        display: flex;
        justify-content: flex-end;

      .form-group {
        margin-bottom: 16px;

      .form-group label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 6px;
      }

      .form-group textarea {
        width: 100%;
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
        color: var(--text-primary);
        font-size: 13px;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        line-height: 1.5;
        min-height: 300px;
        resize: vertical;
      }

      .form-group textarea:focus {
        outline: none;
        border-color: var(--accent);
      }

      /* Tab panel containers */
      .tab-panel {
        display: none;
        flex: 1;
        min-height: 0;
        flex-direction: column;
      }

      .tab-panel.active {
        display: flex;
      }

      /* Memory panel scrollable area */
      .memory-content-area {
        flex: 1;
        overflow-y: auto;
        min-height: 0;
      }

      .memory-content-area::-webkit-scrollbar {
        width: 6px;
      }

      .memory-content-area::-webkit-scrollbar-track {
        background: transparent;
      }

      .memory-content-area::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 3px;
      }

      .memory-content-area::-webkit-scrollbar-thumb:hover {
        background: var(--text-muted);
      }

      .file-card-content::-webkit-scrollbar,
      .modal-body::-webkit-scrollbar {
        width: 6px;
      }

      .file-card-content::-webkit-scrollbar-track,
      .modal-body::-webkit-scrollbar-track {
        background: transparent;
      }

      .file-card-content::-webkit-scrollbar-thumb,
      .modal-body::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 3px;
      }

      .file-card-content::-webkit-scrollbar-thumb:hover,
      .modal-body::-webkit-scrollbar-thumb:hover {
        background: var(--text-muted);
      }

      /* File path display */
      .file-path {
        font-size: 13px;
        color: var(--text-muted);
        margin-top: 2px;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-left">
        <svg
          width="28"

        >
          <rect
            x="4"
            y="2"
            width="24"
            height="28"
            rx="4"
            fill="#faf9f5"
            stroke="#D97757"
            stroke-width="2"
          />
          <rect x="8" y="0" width="16" height="5" rx="2.5" fill="#D97757" />
          <path
            d="M9 13l3 3 5-5"
            fill="none"
            stroke="#D97757"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <rect x="20" y="12" width="5" height="2" rx="1" fill="#c4c4c2" />
          <rect x="9" y="20" width="10" height="2" rx="1" fill="#c4c4c2" />
          <rect x="9" y="25" width="7" height="2" rx="1" fill="#c4c4c2" />
        </svg>
        <div>
          <h1>Productivity</h1>
          <div id="filePath" class="file-path"></div>
        </div>
        <div class="view-toggle" id="mainTabToggle">
          <button id="tasksTabBtn" class="active">Tasks</button>
          <button id="memoryTabBtn">Memory</button>
        </div>
        <div class="view-toggle" id="taskViewToggle">
          <button id="boardViewBtn" class="active">Board</button>
          <button id="listViewBtn">List</button>
        </div>
      </div>
      <div class="buttons">
        <button id="openTaskBtn">Select Tasks Folder</button>
        <button id="openMemoryBtn" style="display: none">Open Folder</button>
        <button id="saveBtn" class="primary" disabled style="display: none">
          Save
        </button>
      </div>
    </header>

    <!-- TASKS TAB PANEL -->
    <div class="tab-panel active" id="tasksPanel">
      <div class="list-view" id="listView" style="display: none"></div>
      <div class="board" id="board">
        <div class="empty-state" id="boardEmptyState" style="width: 100%">
          <p
            style="
              margin-bottom: 24px;
              font-size: 18px;
              font-weight: 600;
              color: var(--text-primary);
            "
          >
            Select your <code>tasks/</code> folder
          </p>
          <button id="openBtnLarge">Select Tasks Folder</button>
        </div>
      </div>
    </div>

    <!-- MEMORY TAB PANEL -->
    <div class="tab-panel" id="memoryPanel">
      <div id="memoryEmptyState" class="empty-state">
        <p
          style="
            margin-bottom: 24px;
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
          "
        >
          Select your project folder
        </p>
        <button id="openMemoryBtnLarge">Select Folder</button>
      </div>
      <div
        id="memoryMainContent"
        style="display: none; flex-direction: column; min-height: 0; flex: 1"
      >
        <div class="memory-tabs" id="memoryTabsContainer"></div>
        <div class="memory-content-area">
          <div id="memoryContentContainer"></div>
        </div>
      </div>
    </div>

    <!-- MODAL (shared for memory) -->
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal">
        <div class="modal-header">
          <h3 id="modalTitle">Edit</h3>
          <button class="modal-close" id="modalClose">&times;</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-footer">
          <button id="modalCancel">Cancel</button>
          <button id="modalSave" class="primary">Save</button>
        </div>
      </div>
    </div>

    <div class="status-bar" id="status"></div>

    <script>
      // ===== SHARED STATE =====
      let activeMainTab = "tasks" // 'tasks' or 'memory'

      const statusEl = document.getElementById("status")
      const filePathEl = document.getElementById("filePath")

      function showStatus(msg) {
        statusEl.textContent = msg
        statusEl.classList.add("visible")
        setTimeout(() => statusEl.classList.remove("visible"), 2000)
      }

      // ===== MAIN TAB SWITCHING =====
      const tasksTabBtn = document.getElementById("tasksTabBtn")
      const memoryTabBtn = document.getElementById("memoryTabBtn")
      const tasksPanel = document.getElementById("tasksPanel")
      const memoryPanel = document.getElementById("memoryPanel")
      const taskViewToggle = document.getElementById("taskViewToggle")
      const openTaskBtn = document.getElementById("openTaskBtn")
      const openMemoryBtn = document.getElementById("openMemoryBtn")
      const saveBtn = document.getElementById("saveBtn")

      function switchMainTab(tab) {
        activeMainTab = tab

        tasksTabBtn.classList.toggle("active", tab === "tasks")
        memoryTabBtn.classList.toggle("active", tab === "memory")

        tasksPanel.classList.toggle("active", tab === "tasks")
        memoryPanel.classList.toggle("active", tab === "memory")

        // Show/hide view toggle for tasks
        taskViewToggle.style.display = tab === "tasks" ? "flex" : "none"

        // Show/hide appropriate buttons
        openTaskBtn.style.display = tab === "tasks" ? "inline-flex" : "none"
        openMemoryBtn.style.display = tab === "memory" ? "inline-flex" : "none"
        // Tasks persist immediately (one file per task) — no manual Save button.
        saveBtn.style.display = "none"

        // Update file path display
        if (tab === "tasks") {
          filePathEl.textContent = taskDirHandle ? taskDirHandle.name + "/" : ""
        } else {
          filePathEl.textContent = memoryDirHandle ? memoryDirHandle.name : ""
        }
      }

      tasksTabBtn.addEventListener("click", () => switchMainTab("tasks"))
      memoryTabBtn.addEventListener("click", () => switchMainTab("memory"))

      // ============================================================
      // ===== TASKS FUNCTIONALITY =====
      // ============================================================

      // Tasks are one markdown file per task under a `tasks/` folder; the task's
      // STATUS is its parent subfolder (active / waiting-on / someday / done).
      // This tab opens that folder and renders each subfolder as a column; moving
      // a card between columns moves the file between subfolders.

      const DONE_COL = "done" // the only column that carries a completed: date
      const TASK_COLUMNS = [
        { id: "active", name: "Active" },
        { id: "waiting-on", name: "Waiting On" },
        { id: "someday", name: "Someday" },
        { id: DONE_COL, name: "Done" },
      ]

      let taskDirHandle = null // the `tasks/` directory
      let tasks = {} // { colId: [ task ] }
      let currentView = "board"
      let taskWatchInterval = null
      let taskInteracting = false // pause the folder watcher during drag/edit
      let lastTaskSignature = ""

      const board = document.getElementById("board")
      const listView = document.getElementById("listView")
      const listViewBtn = document.getElementById("listViewBtn")
      const boardViewBtn = document.getElementById("boardViewBtn")

      function todayStr() {
        const d = new Date()
        const p = (n) => String(n).padStart(2, "0")
        return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`
      }

      function slugify(text) {
        return text
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-|-$/g, "")
      }

      function colName(id) {
        return (TASK_COLUMNS.find((c) => c.id === id) || {}).name || id
      }

      // ---- task file (de)serialization: YAML-ish frontmatter + markdown body ----

      // fields the board owns; every other frontmatter line (e.g. `plan:`) is
      // kept verbatim in `extra` so a drag or edit never drops it
      const OWNED_FIELDS = ["title", "created", "completed"]

      function parseTaskFile(content, slug) {
        const fm = {}
        const extra = []
        let body = content
        const m = content.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/)
        if (m) {
          for (const line of m[1].split("\n")) {
            const kv = line.match(/^([a-zA-Z][\w-]*):\s*(.*)$/)
            if (kv && OWNED_FIELDS.includes(kv[1])) fm[kv[1]] = kv[2].trim()
            else if (line.trim()) extra.push(line)
          }
          body = m[2]
        }
        return {
          slug,
          title: fm.title || slug,
          created: fm.created || "",
          completed: fm.completed || "",
          extra,
          body: body.trim(),
        }
      }

      function serializeTask(task) {
        const fm = ["---", `title: ${task.title}`]
        if (task.created) fm.push(`created: ${task.created}`)
        if (task.completed) fm.push(`completed: ${task.completed}`)
        fm.push(...(task.extra || []))
        fm.push("---")
        let out = fm.join("\n") + "\n"
        if (task.body && task.body.trim()) out += "\n" + task.body.trim() + "\n"
        return out
      }

      // ---- directory IO ----

      async function colDir(colId, create = false) {
        return taskDirHandle.getDirectoryHandle(colId, { create })
      }

      async function loadTasksFromDir() {
        const next = {}
        for (const col of TASK_COLUMNS) {
          next[col.id] = []
          let dir
          try {
            dir = await colDir(col.id, true)
          } catch (e) {
            continue
          }
          for await (const [name, handle] of dir.entries()) {
            if (handle.kind !== "file" || !name.endsWith(".md")) continue
            const file = await handle.getFile()
            const content = await file.text()
            next[col.id].push(parseTaskFile(content, name.replace(/\.md$/, "")))
          }
          next[col.id].sort((a, b) => a.title.localeCompare(b.title))
        }
        tasks = next
      }

      // signature of the current in-memory placement (filenames per column)
      function taskSignature() {
        return TASK_COLUMNS.map(
          (c) =>
            c.id +
            ":" +
            (tasks[c.id] || [])
              .map((t) => t.slug + ".md")
              .sort()
              .join(",")
        ).join("|")
      }

      // same shape, but read cheaply from disk WITHOUT opening file bodies — lets
      // the watcher skip the full reload+parse on the (common) no-change cycle
      async function dirSignature() {
        const parts = []
        for (const col of TASK_COLUMNS) {
          const names = []
          try {
            const dir = await colDir(col.id, true)
            for await (const [name, handle] of dir.entries()) {
              if (handle.kind === "file" && name.endsWith(".md"))
                names.push(name)
            }
          } catch (e) {
            /* folder missing; treat as empty */
          }
          parts.push(col.id + ":" + names.sort().join(","))
        }
        return parts.join("|")
      }

      async function writeTaskFile(colId, task) {
        const dir = await colDir(colId, true)
        const fh = await dir.getFileHandle(task.slug + ".md", { create: true })
        const w = await fh.createWritable()
        await w.write(serializeTask(task))
        await w.close()
      }

      async function removeTaskFile(colId, slug) {
        const dir = await colDir(colId, true)
        await dir.removeEntry(slug + ".md")
      }

      async function uniqueSlug(colId, base) {
        const taken = new Set((tasks[colId] || []).map((t) => t.slug))
        let slug = base || "task"
        let n = 2
        while (taken.has(slug)) {
          slug = `${base}-${n++}`
        }
        return slug
      }

      // ---- mutations (each persists immediately, then re-renders) ----

      async function moveTask(slug, fromCol, toCol) {
        if (fromCol === toCol) return
        const arr = tasks[fromCol] || []
        const idx = arr.findIndex((t) => t.slug === slug)
        if (idx === -1) return
        const task = arr.splice(idx, 1)[0]
        // status lives in the folder; stamp/clear completed on the done boundary
        if (toCol === DONE_COL && !task.completed) task.completed = todayStr()
        if (toCol !== DONE_COL) task.completed = ""
        if (!task.created) task.created = todayStr()
        // avoid slug collision in the destination
        const dstTaken = new Set((tasks[toCol] || []).map((t) => t.slug))
        if (dstTaken.has(task.slug))
          task.slug = await uniqueSlug(toCol, task.slug)
        ;(tasks[toCol] = tasks[toCol] || []).push(task)
        try {
          await writeTaskFile(toCol, task)
          await removeTaskFile(fromCol, slug)
          showStatus(`Moved to ${colName(toCol)}`)
        } catch (e) {
          showStatus("Move failed: " + e.message)
        }
        lastTaskSignature = taskSignature()
        renderTasks()
      }

      async function addTask(colId, title) {
        const base = slugify(title)
        if (!base) return
        const slug = await uniqueSlug(colId, base)
        const task = {
          slug,
          title: title.trim(),
          created: todayStr(),
          completed: colId === DONE_COL ? todayStr() : "",
          extra: [],
          body: "",
        }
        ;(tasks[colId] = tasks[colId] || []).push(task)
        try {
          await writeTaskFile(colId, task)
          showStatus("Added")
        } catch (e) {
          showStatus("Add failed: " + e.message)
        }
        lastTaskSignature = taskSignature()
        renderTasks()
      }

      async function deleteTask(colId, slug) {
        if (!confirm("Delete this task file?")) return
        const arr = tasks[colId] || []
        const idx = arr.findIndex((t) => t.slug === slug)
        if (idx === -1) return
        arr.splice(idx, 1)
        try {
          await removeTaskFile(colId, slug)
          showStatus("Deleted")
        } catch (e) {
          showStatus("Delete failed: " + e.message)
        }
        lastTaskSignature = taskSignature()
        renderTasks()
      }

      async function saveTaskEdits(colId, task) {
        try {
          await writeTaskFile(colId, task)
          showStatus("Saved")
        } catch (e) {
          showStatus("Save failed: " + e.message)
        }
        lastTaskSignature = taskSignature()
        renderTasks()
      }

      // ---- rendering ----

      function renderTasks() {
        if (currentView === "board") renderBoard()
        else renderList()
      }

      function bodyPreview(task) {
        const meta = []
        if (task.completed) meta.push("✓ " + task.completed)
        else if (task.created) meta.push(task.created)
        const first = (task.body || "").split("\n")[0]
        return { meta: meta.join(""), text: first }
      }

      function makeCard(task, colId) {
        const card = document.createElement("div")
        card.className = "task-card"
        card.draggable = true
        card.dataset.slug = task.slug
        card.dataset.col = colId
        const { meta, text } = bodyPreview(task)
        card.innerHTML = `
        <button class="delete-btn" title="Delete">&times;</button>
        <div class="card-title">${escapeHtml(task.title)}</div>
        ${text ? `<div class="card-note">${escapeHtml(text)}</div>` : ""}
        ${meta ? `<div class="card-note" style="opacity:.7;margin-top:4px;">${escapeHtml(meta)}</div>` : ""}
      `
        card.addEventListener("dragstart", (e) => {
          taskInteracting = true
          card.classList.add("dragging")
          e.dataTransfer.setData(
            "text/plain",
            JSON.stringify({ slug: task.slug, col: colId })
          )
          e.dataTransfer.effectAllowed = "move"
        })
        card.addEventListener("dragend", () => {
          taskInteracting = false
          card.classList.remove("dragging")
        })
        card.querySelector(".delete-btn").addEventListener("click", (e) => {
          e.stopPropagation()
          deleteTask(colId, task.slug)
        })
        card.addEventListener("click", (e) => {
          if (e.target.classList.contains("delete-btn")) return
          openTaskEditor(task, colId)
        })
        return card
      }

      function makeColumn(col) {
        const items = tasks[col.id] || []
        const el = document.createElement("div")
        el.className = "column"
        el.innerHTML = `
        <div class="column-header" style="cursor:default;">
          <span>${col.name}</span>
          <span class="count">${items.length}</span>
        </div>
        <div class="cards" data-col="${col.id}"></div>
        <div class="add-card"><button data-add="${col.id}">+ Add task</button></div>
      `
        const cards = el.querySelector(".cards")
        items.forEach((t) => cards.appendChild(makeCard(t, col.id)))
        setupDropTarget(cards, col.id)

        el.querySelector("[data-add]").addEventListener("click", () =>
          startAddTask(el, col.id)
        )
        return el
      }

      // a column/section accepts a dragged card and moves its file on drop
      function setupDropTarget(el, toColId) {
        el.addEventListener("dragover", (e) => {
          e.preventDefault()
          el.classList.add("drag-over")
        })
        el.addEventListener("dragleave", () => el.classList.remove("drag-over"))
        el.addEventListener("drop", (e) => {
          e.preventDefault()
          el.classList.remove("drag-over")
          let data
          try {
            data = JSON.parse(e.dataTransfer.getData("text/plain"))
          } catch (_) {
            return
          }
          if (data && data.slug) moveTask(data.slug, data.col, toColId)
        })
      }

      function startAddTask(columnEl, colId) {
        const holder = columnEl.querySelector(".add-card")
        holder.innerHTML = ""
        const input = document.createElement("textarea")
        input.className = "new-task-input"
        input.rows = 2
        input.placeholder = "Task title…"
        holder.appendChild(input)
        input.focus()
        let done = false
        const commit = (save) => {
          if (done) return
          done = true
          const v = input.value.trim()
          if (save && v) addTask(colId, v)
          else renderTasks()
        }
        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault()
            commit(true)
          } else if (e.key === "Escape") {
            commit(false)
          }
        })
        input.addEventListener("blur", () => commit(true))
      }

      function renderBoard() {
        board.innerHTML = ""
        TASK_COLUMNS.forEach((col) => board.appendChild(makeColumn(col)))
      }

      function renderList() {
        listView.innerHTML = ""
        TASK_COLUMNS.forEach((col) => {
          const items = tasks[col.id] || []
          const section = document.createElement("div")
          section.className = "list-section"
          section.innerHTML = `<div class="list-section-header"><span class="section-title">${col.name}</span><span class="count">${items.length}</span></div>`
          items.forEach((task) => {
            const row = document.createElement("div")
            row.className = "list-item"
            row.draggable = true
            const { meta, text } = bodyPreview(task)
            row.innerHTML = `
            <div class="list-item-content">
              <div class="list-item-title">${escapeHtml(task.title)}</div>
              ${text ? `<div class="list-item-note">${escapeHtml(text)}</div>` : ""}
            </div>
            <span class="list-item-section">${meta || col.name}</span>
          `
            row.addEventListener("dragstart", (e) => {
              taskInteracting = true
              e.dataTransfer.setData(
                "text/plain",
                JSON.stringify({ slug: task.slug, col: col.id })
              )
            })
            row.addEventListener("dragend", () => {
              taskInteracting = false
            })
            row.addEventListener("click", () => openTaskEditor(task, col.id))
            section.appendChild(row)
          })
          setupDropTarget(section, col.id)
          listView.appendChild(section)
        })
      }

      // ---- editor: reuses the shared modal owned by the Memory tab via the
      // modalOverlay.dataset.type dispatch in saveModal() ----

      function openTaskEditor(task, colId) {
        const overlay = document.getElementById("modalOverlay")
        document.getElementById("modalTitle").textContent = task.title
        const metaBits = [
          `<div class="file-path">tasks/${colId}/${task.slug}.md</div>`,
        ]
        for (const line of task.extra || [])
          metaBits.push(`<div class="file-path">${escapeHtml(line)}</div>`)
        document.getElementById("modalBody").innerHTML = `
        <div class="form-group">
          <label>Title</label>
          <textarea id="taskTitleInput" style="min-height:48px;">${escapeHtml(task.title)}</textarea>
        </div>
        <div class="form-group">
          <label>Notes</label>
          <textarea id="taskBodyInput">${escapeHtml(task.body)}</textarea>
        </div>
        ${metaBits.join("")}
      `
        overlay.dataset.type = "taskEdit"
        overlay.dataset.taskCol = colId
        overlay.dataset.taskSlug = task.slug
        overlay.classList.add("visible")
      }

      // called by the Memory tab's saveModal() when dataset.type === 'taskEdit'
      function saveTaskEditFromModal() {
        const overlay = document.getElementById("modalOverlay")
        const colId = overlay.dataset.taskCol
        const slug = overlay.dataset.taskSlug
        const task = (tasks[colId] || []).find((t) => t.slug === slug)
        overlay.classList.remove("visible")
        if (!task) return
        task.title =
          document.getElementById("taskTitleInput").value.trim() || task.title
        task.body = document.getElementById("taskBodyInput").value
        saveTaskEdits(colId, task)
      }

      // ---- view toggle ----

      function switchTaskView(view) {
        currentView = view
        if (view === "list") {
          listView.style.display = "block"
          board.style.display = "none"
          listViewBtn.classList.add("active")
          boardViewBtn.classList.remove("active")
        } else {
          listView.style.display = "none"
          board.style.display = "flex"
          listViewBtn.classList.remove("active")
          boardViewBtn.classList.add("active")
        }
        renderTasks()
      }
      listViewBtn.addEventListener("click", () => switchTaskView("list"))
      boardViewBtn.addEventListener("click", () => switchTaskView("board"))

      // ---- folder watcher: pick up external (CLI/agent) edits ----

      function startTaskWatching() {
        if (taskWatchInterval) clearInterval(taskWatchInterval)
        taskWatchInterval = setInterval(async () => {
          if (
            !taskDirHandle ||
            taskInteracting ||
            modalOverlay.classList.contains("visible")
          )
            return
          try {
            // cheap filenames-only scan first; only pay for body reads on a change
            if ((await dirSignature()) === lastTaskSignature) return
            await loadTasksFromDir()
            lastTaskSignature = taskSignature()
            renderTasks()
          } catch (e) {
            /* directory went away; ignore */
          }
        }, 2000)
      }

      // ---- open the tasks/ folder ----

      async function openTaskDirectory() {
        try {
          const picked = await window.showDirectoryPicker()
          // accept either the `tasks/` folder itself or a parent containing it
          if (picked.name === "tasks") {
            taskDirHandle = picked
          } else {
            try {
              taskDirHandle = await picked.getDirectoryHandle("tasks")
            } catch (_) {
              taskDirHandle = picked
            }
          }
          await loadTasksFromDir()
          lastTaskSignature = taskSignature()
          document.getElementById("boardEmptyState")?.remove()
          switchTaskView("board")
          startTaskWatching()
          filePathEl.textContent = taskDirHandle.name + "/"
          showStatus("Loaded tasks/")
        } catch (e) {
          if (e.name !== "AbortError") showStatus("Error: " + e.message)
        }
      }

      openTaskBtn.addEventListener("click", openTaskDirectory)
      document
        .getElementById("openBtnLarge")
        ?.addEventListener("click", openTaskDirectory)

      // ============================================================
      // ===== MEMORY FUNCTIONALITY =====
      // ============================================================

      let memoryDirHandle = null
      let memoryData = {
        claudeMd: null,
        memoryFiles: [],
        memoryDirs: {},
      }

      const memoryEmptyState = document.getElementById("memoryEmptyState")
      const memoryMainContent = document.getElementById("memoryMainContent")
      const memoryTabsContainer = document.getElementById("memoryTabsContainer")
      const memoryContentContainer = document.getElementById(
        "memoryContentContainer"
      )
      const modalOverlay = document.getElementById("modalOverlay")

      function escapeHtml(text) {
        const div = document.createElement("div")
        div.textContent = text || ""
        return div.innerHTML
      }

      function parseMemoryMarkdown(content) {
        const parsed = {
          title: "",
          fields: {},
          sections: {},
          tables: [],
          rawContent: content,
        }

        const lines = content.split("\n")
        let currentSection = "_intro"
        parsed.sections[currentSection] = []

        for (let i = 0; i < lines.length; i++) {
          const line = lines[i]

          if (line.match(/^# /)) {
            parsed.title = line.replace(/^# /, "").trim()
            continue
          }

          if (line.match(/^## /)) {
            currentSection = line.replace(/^## /, "").trim()
            parsed.sections[currentSection] = []
            continue
          }

          const kvMatch = line.match(/^\*\*(.+?):\*\*\s*(.*)$/)
          if (kvMatch) {
            parsed.fields[kvMatch[1]] = kvMatch[2]
            continue
          }

          parsed.sections[currentSection].push(line)
        }

        for (const key in parsed.sections) {
          parsed.sections[key] = parsed.sections[key].join("\n").trim()
        }

        const tableRegex = /\|(.+)\|\n\|[-| ]+\|\n((?:\|.+\|\n?)+)/g
        let match
        while ((match = tableRegex.exec(content)) !== null) {
          const headers = match[1]
            .split("|")
            .map((h) => h.trim())
            .filter((h) => h)
          const rowLines = match[2].trim().split("\n")
          const rows = rowLines.map((row) =>
            row
              .split("|")
              .map((c) => c.trim())
              .filter((c) => c)
          )
          parsed.tables.push({ headers, rows })
        }

        return parsed
      }

      function getPreview(content, maxLength = 150) {
        let preview = content
          .replace(/^#+ .+$/gm, "")
          .replace(/\*\*(.+?):\*\*.*/g, "")
          .replace(/\|.+\|/g, "")
          .replace(/[-=]{3,}/g, "")
          .trim()
          .substring(0, maxLength)
        if (content.length > maxLength) preview += "..."
        return preview
      }

      function getDisplayName(filename) {
        return filename
          .replace(".md", "")
          .split(/[-_]/)
          .map((w) => w.charAt(0).toUpperCase() + w.slice(1))
          .join(" ")
      }

      async function loadMemoryDirectory() {
        try {
          memoryDirHandle = await window.showDirectoryPicker()

          memoryData = { claudeMd: null, memoryFiles: [], memoryDirs: {} }

          try {
            const claudeFileHandle =
              await memoryDirHandle.getFileHandle("CLAUDE.md")
            const file = await claudeFileHandle.getFile()
            memoryData.claudeMd = {
              content: await file.text(),
              fileHandle: claudeFileHandle,
            }
          } catch (e) {
            console.log("No CLAUDE.md found")
          }

          try {
            const memoryDir = await memoryDirHandle.getDirectoryHandle("memory")
            for await (const entry of memoryDir.values()) {
              if (entry.kind === "file" && entry.name.endsWith(".md")) {
                const file = await entry.getFile()
                memoryData.memoryFiles.push({
                  name: entry.name,
                  content: await file.text(),
                  fileHandle: entry,
                })
              } else if (entry.kind === "directory") {
                memoryData.memoryDirs[entry.name] = []
                const subDirHandle = entry
                for await (const subEntry of subDirHandle.values()) {
                  if (
                    subEntry.kind === "file" &&
                    subEntry.name.endsWith(".md")
                  ) {
                    const file = await subEntry.getFile()
                    const content = await file.text()
                    memoryData.memoryDirs[entry.name].push({
                      name: subEntry.name,
                      content: content,
                      fileHandle: subEntry,
                      dirHandle: subDirHandle,
                      parsed: parseMemoryMarkdown(content),
                    })
                  }
                }
              }
            }
          } catch (e) {
            console.log("No memory/ directory found")
          }

          renderMemory()
          memoryEmptyState.style.display = "none"
          memoryMainContent.style.display = "flex"
          filePathEl.textContent = memoryDirHandle.name
          showStatus("Loaded memory from " + memoryDirHandle.name)
        } catch (e) {
          if (e.name !== "AbortError") {
            showStatus("Error: " + e.message)
          }
        }
      }

      function renderMemory() {
        renderMemoryTabs()
        renderMemoryContent()
      }

      function renderMemoryTabs() {
        let html = ""

        if (memoryData.claudeMd) {
          html += `<button class="memory-tab active" data-tab="overview">Overview</button>`
        }

        for (const file of memoryData.memoryFiles) {
          const name = file.name.replace(".md", "")
          html += `<button class="memory-tab${!memoryData.claudeMd && memoryData.memoryFiles[0] === file ? " active" : ""}" data-tab="file-${name}">${name}</button>`
        }

        for (const dirName of Object.keys(memoryData.memoryDirs).sort()) {
          const files = memoryData.memoryDirs[dirName]
          let count
          if (dirName === "context") {
            count = 0
            for (const file of files) {
              const p = file.parsed
              count += Object.keys(p.fields).length
              for (const table of p.tables) {
                count += table.rows.length
              }
              for (const [sName, sContent] of Object.entries(p.sections)) {
                if (sContent && sName !== "_intro") {
                  count += sContent
                    .split("\n")
                    .filter((l) => l.trim() && !l.trim().startsWith("|")).length
                }
              }
            }
          } else {
            count = files.length
          }
          html += `<button class="memory-tab" data-tab="dir-${dirName}">${dirName} <span class="count">${count}</span></button>`
        }

        memoryTabsContainer.innerHTML = html

        memoryTabsContainer.querySelectorAll(".memory-tab").forEach((tab) => {
          tab.addEventListener("click", () => {
            memoryTabsContainer
              .querySelectorAll(".memory-tab")
              .forEach((t) => t.classList.remove("active"))
            tab.classList.add("active")
            renderMemoryContent()
          })
        })
      }

      function renderMemoryContent() {
        const activeTab =
          memoryTabsContainer.querySelector(".memory-tab.active")
        if (!activeTab) return

        const tabId = activeTab.dataset.tab

        if (tabId === "overview") {
          renderMemoryOverview()
        } else if (tabId.startsWith("file-")) {
          const fileName = tabId.replace("file-", "") + ".md"
          renderMemoryFile(fileName)
        } else if (tabId.startsWith("dir-")) {
          const dirName = tabId.replace("dir-", "")
          renderMemoryDirectory(dirName)
        }
      }

      function renderMemoryOverview() {
        if (!memoryData.claudeMd) return

        let statsHtml = '<div class="stats">'
        for (const [dirName, files] of Object.entries(memoryData.memoryDirs)) {
          let count
          if (dirName === "context") {
            count = 0
            for (const file of files) {
              const p = file.parsed
              count += Object.keys(p.fields).length
              for (const table of p.tables) {
                count += table.rows.length
              }
              for (const [sName, sContent] of Object.entries(p.sections)) {
                if (sContent && sName !== "_intro") {
                  count += sContent
                    .split("\n")
                    .filter((l) => l.trim() && !l.trim().startsWith("|")).length
                }
              }
            }
          } else {
            count = files.length
          }
          statsHtml += `
          <div class="stat">
            <div class="stat-value">${count}</div>
            <div class="stat-label">${dirName}</div>
          </div>
        `
        }
        statsHtml += "</div>"

        const claudeContent = renderMarkdownToHtml(memoryData.claudeMd.content)

        memoryContentContainer.innerHTML = `
        ${statsHtml}
        <div class="file-card">
          <div class="file-card-header" onclick="this.nextElementSibling.classList.toggle('expanded'); this.querySelector('.toggle').textContent = this.nextElementSibling.classList.contains('expanded') ? '\u2212' : '+'">
            <span class="file-card-title">CLAUDE.md</span>
            <span class="toggle" style="color: var(--text-muted);">&minus;</span>
          </div>
          <div class="file-card-content expanded markdown-content">${claudeContent}</div>
        </div>
        <button onclick="openEditModal('CLAUDE.md', 'claudeMd')" style="margin-top: 10px;">Edit CLAUDE.md</button>
      `
      }

      function renderMemoryFile(fileName) {
        const file = memoryData.memoryFiles.find((f) => f.name === fileName)
        if (!file) return

        const content = renderMarkdownToHtml(file.content)

        memoryContentContainer.innerHTML = `
        <div class="file-card">
          <div class="file-card-header">
            <span class="file-card-title">${fileName}</span>
          </div>
          <div class="file-card-content expanded markdown-content">${content}</div>
        </div>
        <button onclick="openEditModal('${fileName}', 'memoryFile')" style="margin-top: 10px;">Edit ${fileName}</button>
      `
      }

      function renderMemoryDirectory(dirName) {
        const files = memoryData.memoryDirs[dirName] || []

        // Context directory uses flat list view
        if (dirName === "context") {
          renderMemoryDirectoryFlat(dirName, files)
          return
        }

        // All other directories use card grid view
        let html = `
        <div class="search-box">
          <span style="color: var(--text-muted);">&#128269;</span>
          <input type="text" placeholder="Search ${dirName}..." id="dirSearch" oninput="filterMemoryDirectory('${dirName}', this.value)">
        </div>
        <div class="memory-grid" id="dirGrid">
      `

        for (const file of files) {
          const p = file.parsed
          const title = p.title || getDisplayName(file.name)

          let fieldsHtml = ""
          const fieldEntries = Object.entries(p.fields).slice(0, 3)
          if (fieldEntries.length > 0) {
            fieldsHtml = '<div class="memory-card-fields">'
            for (const [key, value] of fieldEntries) {
              fieldsHtml += `
              <div class="memory-card-field">
                <span class="memory-card-field-label">${escapeHtml(key)}</span>
                <span class="memory-card-field-value">${escapeHtml(value)}</span>
              </div>
            `
            }
            fieldsHtml += "</div>"
          }

          let preview = ""
          for (const [sectionName, sectionContent] of Object.entries(
            p.sections
          )) {
            if (sectionContent && sectionName !== "_intro") {
              preview = getPreview(sectionContent, 100)
              break
            }
          }
          if (!preview) preview = getPreview(p.rawContent, 100)

          html += `
          <div class="memory-card" onclick="openFileModal('${dirName}', '${file.name}')" data-search="${escapeHtml((title + " " + JSON.stringify(p.fields) + " " + p.rawContent).toLowerCase())}">
            <div class="memory-card-title">${escapeHtml(title)}</div>
            ${fieldsHtml}
            <div class="memory-card-preview">${escapeHtml(preview)}</div>
          </div>
        `
        }

        html += `
        <div class="add-btn" onclick="openNewFileModal('${dirName}')">
          + Add to ${dirName}
        </div>
      </div>`

        memoryContentContainer.innerHTML = html
      }

      function renderMemoryDirectoryFlat(dirName, files) {
        let html = `
        <div class="search-box">
          <span style="color: var(--text-muted);">&#128269;</span>
          <input type="text" placeholder="Search ${dirName}..." id="dirSearch" oninput="filterMemoryDirectory('${dirName}', this.value)">
        </div>
        <div id="dirGrid">
      `

        for (const file of files) {
          const p = file.parsed

          // Render fields as a key-value table
          const fieldEntries = Object.entries(p.fields)
          if (fieldEntries.length > 0) {
            html += `<div class="file-card" style="margin-bottom: 16px;"><table class="memory-flat-table"><tbody>`
            for (const [key, value] of fieldEntries) {
              html += `<tr data-search="${escapeHtml((key + " " + value).toLowerCase())}"><td>${escapeHtml(key)}</td><td>${escapeHtml(value)}</td></tr>`
            }
            html += `</tbody></table></div>`
          }

          // Render parsed tables (teams, tools, etc.) as proper HTML tables
          for (const table of p.tables) {
            html += `<div class="file-card" style="margin-bottom: 16px;"><table class="memory-flat-table"><thead><tr>`
            for (const h of table.headers) {
              html += `<th>${escapeHtml(h)}</th>`
            }
            html += `</tr></thead><tbody>`
            for (const row of table.rows) {
              const searchData = row.join(" ").toLowerCase()
              html += `<tr data-search="${escapeHtml(searchData)}">`
              for (const cell of row) {
                html += `<td>${escapeHtml(cell)}</td>`
              }
              html += `</tr>`
            }
            html += `</tbody></table></div>`
          }

          // Render non-table section content as list items
          for (const [sectionName, sectionContent] of Object.entries(
            p.sections
          )) {
            if (!sectionContent || sectionName === "_intro") continue
            const lines = sectionContent
              .split("\n")
              .filter((l) => l.trim() && !l.trim().startsWith("|"))
            if (lines.length === 0) continue
            html += `<div class="file-card" style="margin-bottom: 16px;"><table class="memory-flat-table"><thead><tr><th colspan="2">${escapeHtml(sectionName)}</th></tr></thead><tbody>`
            for (const line of lines) {
              const cleanLine = line
                .replace(/^[-*]\s*/, "")
                .replace(/\*\*(.+?)\*\*/g, "$1")
                .trim()
              if (!cleanLine) continue
              html += `<tr data-search="${escapeHtml((sectionName + " " + cleanLine).toLowerCase())}"><td colspan="2">${escapeHtml(cleanLine)}</td></tr>`
            }
            html += `</tbody></table></div>`
          }
        }

        html += `</div>`
        memoryContentContainer.innerHTML = html
      }

      function filterMemoryDirectory(dirName, searchTerm) {
        const grid = document.getElementById("dirGrid")
        const items = grid.querySelectorAll(".memory-card, tr[data-search]")
        const search = searchTerm.toLowerCase()
        items.forEach((item) => {
          const searchData = item.dataset.search || ""
          item.style.display =
            !search || searchData.includes(search) ? "" : "none"
        })
      }

      function renderMarkdownToHtml(md) {
        let html = escapeHtml(md)

        html = html.replace(/^### (.+)$/gm, "<h3>$1</h3>")
        html = html.replace(/^## (.+)$/gm, "<h2>$1</h2>")
        html = html.replace(/^# (.+)$/gm, "<h1>$1</h1>")
        html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        html = html.replace(/\*(.+?)\*/g, "<em>$1</em>")
        html = html.replace(/```[\s\S]*?```/g, (match) => {
          const code = match.replace(/```\w*\n?/g, "")
          return "<pre><code>" + code + "</code></pre>"
        })
        html = html.replace(/`([^`]+)`/g, "<code>$1</code>")
        html = html.replace(
          /(\|.+\|\n\|[-| ]+\|\n(?:\|.+\|\n?)+)/g,
          (match) => {
            const lines = match.trim().split("\n")
            const headers = lines[0].split("|").filter((c) => c.trim())
            const rows = lines
              .slice(2)
              .map((row) => row.split("|").filter((c) => c.trim()))
            let table = "<table><thead><tr>"
            headers.forEach((h) => (table += `<th>${h.trim()}</th>`))
            table += "</tr></thead><tbody>"
            rows.forEach((row) => {
              table += "<tr>"
              row.forEach((cell) => (table += `<td>${cell.trim()}</td>`))
              table += "</tr>"
            })
            table += "</tbody></table>"
            return table
          }
        )
        html = html.replace(/^- (.+)$/gm, "<li>$1</li>")
        html = html.replace(/(<li>.*<\/li>\n?)+/g, "<ul>$&</ul>")
        html = html.replace(/^(?!<[hupol]|<li|<table|<pre)(.+)$/gm, "<p>$1</p>")
        html = html.replace(/<p><\/p>/g, "")
        html = html.replace(/<p>\s*<\/p>/g, "")

        return html
      }

      // Modal functions
      function openFileModal(dirName, fileName) {
        const files = memoryData.memoryDirs[dirName]
        const file = files.find((f) => f.name === fileName)
        if (!file) return

        document.getElementById("modalTitle").textContent =
          getDisplayName(fileName)
        document.getElementById("modalBody").innerHTML = `
        <div class="markdown-content" style="margin-bottom: 20px;">
          ${renderMarkdownToHtml(file.content)}
        </div>
        <div class="form-group">
          <label>Edit Raw Markdown</label>
          <textarea id="editContent">${escapeHtml(file.content)}</textarea>
        </div>
      `

        modalOverlay.classList.add("visible")
        modalOverlay.dataset.type = "dirFile"
        modalOverlay.dataset.dirName = dirName
        modalOverlay.dataset.fileName = fileName
      }

      function openNewFileModal(dirName) {
        document.getElementById("modalTitle").textContent = `Add to ${dirName}`

        let template = "# New Entry\n\n"
        const existingFiles = memoryData.memoryDirs[dirName]
        if (existingFiles && existingFiles.length > 0) {
          const sample = existingFiles[0].parsed
          for (const key of Object.keys(sample.fields)) {
            template += `**${key}:** \n`
          }
          template += "\n"
          for (const section of Object.keys(sample.sections)) {
            if (section !== "_intro") {
              template += `## ${section}\n\n`
            }
          }
        }

        document.getElementById("modalBody").innerHTML = `
        <div class="form-group">
          <label>Filename (without .md)</label>
          <input type="text" id="newFileName" placeholder="my-new-entry" style="width: 100%; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; color: var(--text-primary); font-size: 14px; font-family: inherit; margin-bottom: 16px;">
        </div>
        <div class="form-group">
          <label>Content</label>
          <textarea id="editContent">${escapeHtml(template)}</textarea>
        </div>
      `

        modalOverlay.classList.add("visible")
        modalOverlay.dataset.type = "newDirFile"
        modalOverlay.dataset.dirName = dirName
      }

      function openEditModal(fileName, type) {
        let content = ""
        if (type === "claudeMd") {
          content = memoryData.claudeMd.content
        } else if (type === "memoryFile") {
          const file = memoryData.memoryFiles.find((f) => f.name === fileName)
          if (file) content = file.content
        }

        document.getElementById("modalTitle").textContent = `Edit ${fileName}`
        document.getElementById("modalBody").innerHTML = `
        <div class="form-group">
          <label>Content</label>
          <textarea id="editContent" style="min-height: 400px;">${escapeHtml(content)}</textarea>
        </div>
      `

        modalOverlay.classList.add("visible")
        modalOverlay.dataset.type = type
        modalOverlay.dataset.fileName = fileName
      }

      function closeModal() {
        modalOverlay.classList.remove("visible")
      }

      async function saveModal() {
        const type = modalOverlay.dataset.type

        // Task editor (Tasks tab) — handled separately; no `editContent` field.
        if (type === "taskEdit") {
          saveTaskEditFromModal()
          return
        }

        const content = document.getElementById("editContent").value

        try {
          if (type === "claudeMd") {
            memoryData.claudeMd.content = content
            const writable =
              await memoryData.claudeMd.fileHandle.createWritable()
            await writable.write(content)
            await writable.close()
            showStatus("Saved CLAUDE.md")
          } else if (type === "memoryFile") {
            const fileName = modalOverlay.dataset.fileName
            const file = memoryData.memoryFiles.find((f) => f.name === fileName)
            if (file) {
              file.content = content
              const writable = await file.fileHandle.createWritable()
              await writable.write(content)
              await writable.close()
              showStatus("Saved " + fileName)
            }
          } else if (type === "dirFile") {
            const dirName = modalOverlay.dataset.dirName
            const fileName = modalOverlay.dataset.fileName
            const files = memoryData.memoryDirs[dirName]
            const file = files.find((f) => f.name === fileName)
            if (file) {
              file.content = content
              file.parsed = parseMemoryMarkdown(content)
              const writable = await file.fileHandle.createWritable()
              await writable.write(content)
              await writable.close()
              showStatus("Saved " + fileName)
            }
          } else if (type === "newDirFile") {
            const dirName = modalOverlay.dataset.dirName
            let fileName = document.getElementById("newFileName").value.trim()
            if (!fileName) {
              showStatus("Please enter a filename")
              return
            }
            if (!fileName.endsWith(".md")) fileName += ".md"

            const memoryDir = await memoryDirHandle.getDirectoryHandle("memory")
            const subDir = await memoryDir.getDirectoryHandle(dirName, {
              create: true,
            })
            const fileHandle = await subDir.getFileHandle(fileName, {
              create: true,
            })

            const writable = await fileHandle.createWritable()
            await writable.write(content)
            await writable.close()

            memoryData.memoryDirs[dirName].push({
              name: fileName,
              content: content,
              fileHandle: fileHandle,
              dirHandle: subDir,
              parsed: parseMemoryMarkdown(content),
            })

            showStatus("Created " + fileName)
          }

          closeModal()
          renderMemory()
        } catch (e) {
          showStatus("Error saving: " + e.message)
        }
      }

      // Memory event listeners
      openMemoryBtn.addEventListener("click", loadMemoryDirectory)
      document
        .getElementById("openMemoryBtnLarge")
        .addEventListener("click", loadMemoryDirectory)
      document
        .getElementById("modalClose")
        .addEventListener("click", closeModal)
      document
        .getElementById("modalCancel")
        .addEventListener("click", closeModal)
      document.getElementById("modalSave").addEventListener("click", saveModal)

      modalOverlay.addEventListener("click", (e) => {
        if (e.target === modalOverlay) closeModal()
      })

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeModal()
      })

      // Expose functions to onclick handlers
      window.openFileModal = openFileModal
      window.openNewFileModal = openNewFileModal
      window.openEditModal = openEditModal
      window.filterMemoryDirectory = filterMemoryDirectory
    </script>
  </body>
</html>
