<style>

<span style="font-size: 12px; color: #cdd1db;">Draft · 2 changes</span>

</div>
<div style="display: flex; gap: 8px;">
<button style="flex: 1; height: 44px; border-radius: 999px; background: rgba(255,255,255,0.14); font-size: 14px; font-weight: 500;">Preview</button>
<button class="lamp" style="flex: 1; height: 44px; border-radius: 999px; font-size: 14px; font-weight: 600;">Publish</button>

</a>
