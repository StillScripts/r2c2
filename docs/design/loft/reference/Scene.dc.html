class Component extends DCLogic {
  renderVals() {
    const view = this.props.view ?? 'city';
    return {
      isCity: view === 'city',
      isCoast: view === 'coast',
      isAlps: view === 'alps',
      frame: this.props.frame ?? true
    };
  }
}
